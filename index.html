body::after{content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(5,8,11,.88) 0%,rgba(5,8,11,.72) 30%,rgba(5,8,11,.88) 100%),
    radial-gradient(900px 600px at 50% 0%,rgba(61,220,151,.07),transparent 70%)}
@media (min-width:860px){body::before{background-attachment:fixed;background-position:center 60%}}
@media (max-width:600px){body::before{background-position:center 78%}}
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:28px 20px 96px}
.eyebrow{font-size:13px;color:var(--accent);letter-spacing:.04em;margin-bottom:6px}
.timeline{display:flex;gap:6px;font-size:11px;color:var(--dim);margin-bottom:18px;flex-wrap:wrap}
.timeline b{color:var(--accent)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.big{font-size:clamp(26px,6.5vw,40px);font-weight:700;line-height:1.15;margin:8px 0}
.line{font-size:17px;line-height:1.6;color:var(--txt);margin:8px 0;min-height:1em}
.lead{font-size:15px;color:var(--dim);margin-bottom:16px}
.tag{display:inline-block;font-size:11px;color:var(--accent2);border:1px solid #4a3d1f;background:#1a1509;
  padding:3px 9px;border-radius:20px;margin-bottom:12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button.primary{background:var(--accent);color:#04170f;border:none;padding:13px 24px;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);padding:12px 20px;
  border-radius:10px;font-size:14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;
  text-align:left;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-2px)}
.opt.sel{border-color:var(--accent);background:#0e1e18}
.opt .em{font-size:22px;display:block;margin-bottom:6px}
.opt .t{font-size:14px;font-weight:600}
.opt .d{font-size:12px;color:var(--dim);margin-top:4px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
  cursor:pointer;font-size:14.5px;text-align:left}
.choice:hover{border-color:var(--accent)}
.choice small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.result{border-left:3px solid var(--accent);padding:14px 16px;background:var(--card);border-radius:8px;margin:14px 0}
.result.warn{border-color:var(--warn)}
.result.gold{border-color:var(--accent2)}
.result.blue{border-color:var(--blue)}
.result h3{margin:0 0 6px;font-size:17px}
.diagram{font-family:monospace;font-size:13px;color:var(--accent);line-height:2;white-space:pre;margin:14px 0}
.scenarios{display:grid;gap:10px;margin:14px 0}
.sc{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card)}
.sc b{color:var(--accent2)}
.summary-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);
  padding:9px 0;font-size:14px}
.summary-row span:first-child{color:var(--dim)}
.progressbar{height:3px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.opt,.choice,.result,.stat,.sc{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.future-grid{display:grid;gap:10px;margin:14px 0}
.future-card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card)}
.future-card .ft{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.future-card p{margin:0;font-size:13.5px;color:var(--txt);line-height:1.5}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
.stat .track{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.stat .track i{display:block;height:100%;background:var(--accent)}
.vtimeline{border-left:2px solid var(--line);margin:18px 0 18px 8px;padding-left:18px}
.vtimeline .ev{margin-bottom:16px;position:relative}
.vtimeline .ev:before{content:'';position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.vtimeline .age{font-size:12px;color:var(--accent2);font-weight:700}
.vtimeline .txt{font-size:14px;color:var(--txt);margin-top:2px}

html[data-theme="light"]{--bg:#f2f5f3;--bg2:#e9efec;--card:rgba(255,255,255,.82);--line:#d7e2dc;--txt:#16211b;--dim:#5a6b62;--accent:#2f8fd1;--accent2:#a9710a;--warn:#c23b3b;--blue:#1f6fb0}

@media (min-width:860px){html[data-theme="light"] body::before{background-position:center 58%}}
@media (max-width:600px){html[data-theme="light"] body::before{background-position:center 80%}}
.reduce-motion .stage{animation:none!important}
.reduce-motion *{transition:none!important;scroll-behavior:auto!important}
.opt:focus-visible,.choice:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gear-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:40;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.settings-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.settings-panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;color:var(--txt)}
.settings-panel h3{margin-top:0;font-size:18px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.settings-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.settings-row select,.settings-row input[type=range]{accent-color:var(--accent)}
.review-list{max-height:220px;overflow-y:auto;margin:6px 0}

.navbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav-arrow{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:50%;
  font-size:16px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav-arrow:disabled{opacity:.25;cursor:default}
.nav-arrow:not(:disabled):hover{border-color:var(--accent)}

<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');

/* ---------------- CONFIGURAÇÕES, SOM E PERSISTÊNCIA ---------------- */
let SETTINGS={theme:'system',sound:true,volume:60,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches};
(function loadSettings(){try{const s=JSON.parse(localStorage.getItem('esf_settings'));if(s)SETTINGS=Object.assign(SETTINGS,s);}catch(e){}})();
function saveSettings(){try{localStorage.setItem('esf_settings',JSON.stringify(SETTINGS));}catch(e){}}
function effectiveTheme(){return SETTINGS.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):SETTINGS.theme;}
function applyTheme(){document.documentElement.setAttribute('data-theme',effectiveTheme());}
function applyMotion(){document.documentElement.classList.toggle('reduce-motion',!!SETTINGS.reducedMotion);}
applyTheme();applyMotion();

/* ---------------- NAVEGAÇÃO (voltar/avançar, swipe, teclado) ---------------- */
let HISTORY=[]; let CURRENT_SCREEN=null; let NAV={back:null,forward:null};
function clone(o){return JSON.parse(JSON.stringify(o));}
function pushHistory(){ if(CURRENT_SCREEN) HISTORY.push({S:clone(S),screen:CURRENT_SCREEN}); }
function goBack(){ if(!HISTORY.length) return; const h=HISTORY.pop(); S=h.S; h.screen(); }
function setNav(back,forward){ NAV={back,forward}; }
(function initNavGestures(){
  let sx=0,sy=0,active=false;
  app.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;active=true;},{passive:true});
  app.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dy)<40){ if(dx>0){NAV.back&&NAV.back();}else{NAV.forward&&NAV.forward();} }
  },{passive:true});
  document.addEventListener('keydown',e=>{
    const tag=document.activeElement&&document.activeElement.tagName;
    if(tag==='SELECT'||tag==='INPUT')return;
    if(e.key==='ArrowLeft'&&NAV.back){NAV.back();}
    else if(e.key==='ArrowRight'&&NAV.forward){NAV.forward();}
  });
})();


let AUDIO_CTX=null;
function playTone(freq,dur,type){
  if(!SETTINGS.sound)return;
  try{
    if(!AUDIO_CTX)AUDIO_CTX=new (window.AudioContext||window.webkitAudioContext)();
    const o=AUDIO_CTX.createOscillator(),g=AUDIO_CTX.createGain();
    o.type=type||'sine';o.frequency.value=freq;g.gain.value=(SETTINGS.volume/100)*0.18;
    o.connect(g);g.connect(AUDIO_CTX.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,AUDIO_CTX.currentTime+dur);o.stop(AUDIO_CTX.currentTime+dur);
  }catch(e){}
}
function sfx(kind){
  const m={select:[480,.07,'sine'],advance:[640,.1,'triangle'],confirm:[760,.14,'triangle'],complete:[880,.35,'sine']};
  const p=m[kind]||m.select;playTone(p[0],p[1],p[2]);
}

const SAVE_VERSION=3;
function snapshot(lastAge){try{localStorage.setItem('esf_save',JSON.stringify({v:SAVE_VERSION,lastAge,S}));}catch(e){}}
function loadSnapshot(){try{const d=JSON.parse(localStorage.getItem('esf_save')||'null');if(!d||d.v!==SAVE_VERSION)return null;return d;}catch(e){return null;}}
function clearSnapshot(){try{localStorage.removeItem('esf_save');}catch(e){}}

function gearBtn(){

function clamp(v){return Math.max(0,Math.min(100,v));}
function rand(){
  let x=(S.seed|0)+0x6D2B79F5|0;
  let t=Math.imul(x^x>>>15,1|x);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  S.seed=x;
  return ((t^t>>>14)>>>0)/4294967296;
}
function pickWeighted(list){
  const total=list.reduce((s,e)=>s+(e.weight||1),0);
  let r=rand()*total;
  for(const e of list){ r-=(e.weight||1); if(r<=0) return e; }
  return list[list.length-1];
}
function applyEffects(eff){
  Object.entries(eff).forEach(([k,v])=>{ S.stats[k]=clamp((S.stats[k]||0)+v); });
  const dv=CONFIG.derive;
  if(eff.satisfaction!==undefined){
    const d=eff.satisfaction;
    S.stats.fulfillment=clamp(S.stats.fulfillment+d*dv.fulfillmentFromSatisfaction);
    S.stats.mentalStress=clamp(S.stats.mentalStress-d*dv.mentalStressFromSatisfaction);
    S.stats.physFatigue=clamp(S.stats.physFatigue-d*dv.physFatigueFromSatisfaction);
  }
  if(eff.relationship!==undefined && eff.relationship<0){
    S.stats.mentalStress=clamp(S.stats.mentalStress-eff.relationship*dv.mentalStressFromRelationship);
  }
  if(eff.stability!==undefined) S.stats.finStability=clamp(S.stats.finStability+eff.stability*dv.finStabilityFromStability);
  if(eff.salary!==undefined) S.stats.finStability=clamp(S.stats.finStability+eff.salary*dv.finStabilityFromSalary);
  if(eff.experience!==undefined) S.stats.physFatigue=clamp(S.stats.physFatigue+eff.experience*dv.physFatigueFromExperience);
  if(eff.qualification!==undefined) S.stats.mentalStress=clamp(S.stats.mentalStress+eff.qualification*dv.mentalStressFromQualification);
}
function flagCrisis(tag){
  if(!S.crises.includes(tag)){ S.crises.push(tag); if(!S.defeated && !S.pendingCrisis) S.pendingCrisis=tag; }
}
function checkCrises(){
  if(!S.profId) return; // antes do primeiro emprego os valores zerados são só o ponto de partida
  const s=S.stats;
  if(s.finStability<=CONFIG.crisisAt.finStability) flagCrisis('financeira');
  if(s.fulfillment<=CONFIG.crisisAt.fulfillment) flagCrisis('carreira');
  // salário e saldo só viram crise depois do 1º ciclo de pagamento possível, senão disparariam
  // logo após a contratação (quando ainda é normal estar com saldo zero, por design).
  const pastFirstPayday=S.timeline.some(t=>CONFIG.milestoneAges.includes(t.age));
  if(pastFirstPayday){
    if(s.salary<=CONFIG.crisisAt.salaryLevel) flagCrisis('salarial');
    if(S.saldo<=CONFIG.crisisAt.saldo) flagCrisis('saldo');
  }
}

function screenCrisis(tag){
  const resumeFn=CURRENT_SCREEN;
  CURRENT_SCREEN=()=>screenCrisis(tag);
  const cc=CRISIS_CONTENT[tag];
  const lastAge=S.timeline.length?S.timeline[S.timeline.length-1].age:18;
  const n=el(`<div class="eyebrow">CRISE</div>
    <div class="result warn"><h3>⚠️ ${cc.title}</h3><p>Isso não encerra sua jornada — mas exige uma decisão agora.</p></div>
    <div class="choices" id="c"></div>`);
  const c=n.querySelector('#c');
  cc.opts.forEach(opt=>{
    const b=document.createElement('div');b.className='choice';b.textContent=opt.text;
    b.onclick=()=>{
      pushHistory();
      applyEffects(opt.effects);
      if(opt.money!==undefined) S.saldo=Math.max(0,S.saldo+opt.money);
      S.decisionHistory.push(opt.hist); S.timeline.push({age:lastAge,text:opt.hist});
      snapshot(lastAge);
      if(checkDefeat()) return;
      resumeFn();
    };
    c.appendChild(b);
  });
  setNav(HISTORY.length?goBack:null, null);
  render(n);
}
function processPayday(age){
  if(!S.employed) return;
  const p=CONFIG.payday;
  const income=Math.round(p.incomeBase+S.stats.salary*p.incomePerSalaryLevel);
  const expense=Math.round(Math.max(p.expenseFloor,p.expenseBase-S.stats.finStability*p.expensePerStability));
  S.saldo=Math.max(0,S.saldo+income-expense);
  if(income>expense) S.stats.finStability=clamp(S.stats.finStability+3);
}
function checkDefeat(){
  const s=S.stats;
  const physDead=s.physFatigue>=CONFIG.instantDefeat.physFatigue, mentalDead=s.mentalStress>=CONFIG.instantDefeat.mentalStress;
  if(physDead||mentalDead){ S.defeated=true; screenDefeat(physDead&&mentalDead?'ambos':(physDead?'fisico':'mental')); return true; }
  return false;
}

  const pr=P[S.profId];

    <div class="btnrow"><button class="primary" id="restart" type="button">RECOMEÇAR MINHA HISTÓRIA</button></div>`);
  setNav(null,null);
  render(n,true);
  n.querySelector('#restart').onclick=()=>{S.defeated=false;screenIntro();};
}
function logHist(age,text){
  S.decisionHistory.push(text); S.timeline.push({age,text}); snapshot(age);
  if(CONFIG.milestoneAges.includes(age)) processPayday(age);
  checkCrises();

}

function bar(pct){return `<div class="progressbar"><i style="width:${pct}%"></i></div>`;}
function render(node,bypassDefeat){
  if(S.defeated&&!bypassDefeat) return;
  if(S.pendingCrisis){ const tag=S.pendingCrisis; S.pendingCrisis=null; screenCrisis(tag); return; }
  app.innerHTML='';
  const navEl=document.createElement('div');navEl.className='navbar';
  navEl.innerHTML=`<button id="navBack" class="nav-arrow" aria-label="Voltar"${NAV.back?'':' disabled'}>←</button><span></span><button id="navFwd" class="nav-arrow" aria-label="Avançar"${NAV.forward?'':' disabled'}>→</button>`;
  app.appendChild(navEl);
  if(NAV.back) navEl.querySelector('#navBack').onclick=NAV.back;
  if(NAV.forward) navEl.querySelector('#navFwd').onclick=NAV.forward;
  app.appendChild(node);
  node.querySelectorAll('.opt,.choice').forEach(elx=>{
    elx.setAttribute('tabindex','0');elx.setAttribute('role','button');
    elx.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();elx.click();}});
    elx.addEventListener('click',()=>sfx('select'));
  });
  node.querySelectorAll('button.primary,button.ghost').forEach(b=>b.addEventListener('click',()=>sfx('advance')));
  window.scrollTo(0,0);
}
function el(html){const d=document.createElement('div');d.className='stage';d.innerHTML=html;return d;}
const STAT_POLARITY={finStability:1,fulfillment:1,techAdapt:1,opportunities:1,
  physFatigue:-1,mentalStress:-1,automationRisk:-1,aiExposure:-1};
const BAND_LABELS_POS=['Ruim','Médio','Alto','Excelente'];
const BAND_LABELS_NEG=['Extremo','Alto','Moderado','Baixo'];
const BAND_COLORS=['var(--warn)','var(--accent2)','var(--accent)','var(--blue)'];
function statBand(key){
  const v=S.stats[key]; const pol=STAT_POLARITY[key]!==undefined?STAT_POLARITY[key]:1;
  const score=pol>0?v:(100-v);
  const labels=pol>0?BAND_LABELS_POS:BAND_LABELS_NEG;
  const idx=score<=25?0:score<=50?1:score<=75?2:3;
  return {label:labels[idx],color:BAND_COLORS[idx]};
}
function statBadges(keys){
  const labels={salary:'Salário',stability:'Estabilidade',experience:'Experiência',specialization:'Especialização',
    qualification:'Qualificação',techAdapt:'Adaptação tecnológica',relationship:'Relacionamento',
    automationRisk:'Risco de automação',aiExposure:'Exposição à IA',satisfaction:'Satisfação',
    opportunities:'Oportunidades',promotionChance:'Chance de promoção',careerChangeChance:'Chance de mudar de carreira',
    finStability:'Estabilidade financeira',physFatigue:'Cansaço físico',mentalStress:'Cansaço mental',fulfillment:'Realização profissional'};
  return `<div class="stats-grid">${keys.map(k=>{
    const b=statBand(k);
    return `<div class="stat"><div class="l">${labels[k]}</div>
    <div class="track"><i style="width:${S.stats[k]}%;background:${b.color}"></i></div>
    <div style="font-size:10px;font-weight:700;color:${b.color};margin-top:3px">${b.label}</div></div>`;
  }).join('')}</div>`;
}
function economyPanel(){
  const crisisTag=S.crises.length?`<div class="tag" style="border-color:var(--warn);color:var(--warn);background:transparent">⚠️ Crise: ${S.crises.join(', ')}</div>`:'';
  return `${crisisTag}${statBadges(['finStability','physFatigue','mentalStress','fulfillment'])}
    <div class="line" style="color:var(--dim);font-size:13px">Situação: ${S.employed?'empregado(a)':'desempregado(a)'} · Nível salarial: ${salaryTier()} · Saldo: R$ ${S.saldo}</div>`;
}

      S.stats.finStability=clamp(S.stats.finStability+(fj.finStabilityRange[0]+t*(fj.finStabilityRange[1]-fj.finStabilityRange[0])));
      S.stats.fulfillment=clamp(S.stats.fulfillment+(fj.fulfillmentRange[0]+t*(fj.fulfillmentRange[1]-fj.fulfillmentRange[0])));
      S.stats.physFatigue=clamp(S.stats.physFatigue+(pr.automationRisk/100)*fj.physFatigueRange[1]);
      S.stats.mentalStress=clamp(S.stats.mentalStress+(pr.automationRisk/100)*fj.mentalStressRange[1]);
      logHist(age,'Tornou-se '+pr.name.toLowerCase()+'.');
      screenDecision(25);
    };
    g.appendChild(o);
  });
  setNav(HISTORY.length?goBack:null, null);
  render(n);
}

function decisionIntro(age){
  const pr=P[S.profId];
  const nm=pr?pr.name.toLowerCase():'profissional';
  const ar=pr?pr.area.toLowerCase():'sua área';
  if(age===25) return `Já são alguns anos como ${nm}. O dia a dia em ${ar} trouxe uma decisão que vai pesar no seu futuro.`;
  if(age===31) return `No meio da sua jornada como ${nm}, uma oportunidade — ou um dilema — bate à sua porta.`;
  if(age===40) return `Com experiência acumulada como ${nm}, chegou a hora de decidir que tipo de profissional você quer ser daqui pra frente.`;
  return 'Uma nova decisão importante surge no seu caminho.';
}
function screenDecision(age){
  let pool=POOLS[age];
  if(pool==='EVENT') return screenEvent(age,36,()=>screenDecision(31));
  if(pool==='EVENT2') return screenEvent(age,52,()=>screenDecision(40));
  if(age===21){ pool=POOLS[21][PATHS[S.pathKey].track]; }
  if(S.profId==='arquiteto'){ if(age===25) pool=ARQ_POOL_25; if(age===40) pool=ARQ_POOL_40; } else if(S.pathKey==='faculdade'&&S.subArea==='ti-formal'){ if(age===25) pool=TI_POOL_25; if(age===40) pool=TI_POOL_40; }
  CURRENT_SCREEN=()=>screenDecision(age);
  const pctMap={25:30,31:60,40:80};
  const n=el(`${bar(pctMap[age]||30)}<div class="eyebrow">${age} ANOS</div>
    ${economyPanel()}
    <div class="line">${decisionIntro(age)}</div>
    <div class="choices" id="c"></div>`);
  const c=n.querySelector('#c');
  pool.forEach(opt=>{
    const b=document.createElement('div');b.className='choice';
    b.innerHTML=`${opt.text}<small>${opt.hint||''}</small>`;
    b.onclick=()=>{
      pushHistory();
      applyEffects(opt.effects); logHist(age,opt.hist);
      if(opt.migrate){ S.stats.careerChangeChance=clamp(S.stats.careerChangeChance+10); }
      nextAfter(age);
    };
    c.appendChild(b);
  });
  setNav(HISTORY.length?goBack:null, null);
  render(n);
}

function screenEvent(age,pct,nextFn){
  CURRENT_SCREEN=()=>screenEvent(age,pct,nextFn);
  let candidates=EVENTS.filter(e=>e.cond(S));
  const unseen=candidates.filter(e=>!S.seenEvents.includes(e.id));
  if(unseen.length) candidates=unseen;
  const ev=pickWeighted(candidates)||EVENTS[1];
  S.seenEvents.push(ev.id);
  const n=el(`${bar(pct)}<div class="eyebrow">${age} ANOS · ACONTECIMENTO</div>
    ${economyPanel()}
    <div class="big" style="font-size:23px">${ev.title}</div>
    <div class="choices" id="c"></div>`);
  const c=n.querySelector('#c');
  ev.opts.forEach(opt=>{
    const b=document.createElement('div');b.className='choice';b.textContent=opt.text;
    b.onclick=()=>{
      pushHistory();applyEffects(opt.effects);
      if(opt.money!==undefined) S.saldo=Math.max(0,S.saldo+opt.money);
      logHist(age,opt.hist);nextFn();
    };
    c.appendChild(b);
  });
  setNav(HISTORY.length?goBack:null, null);
  render(n);
}

function nextAfter(age){
  if(age===21) screenDecision(25);
  else if(age===25) screenDecision(28);
  else if(age===31) screenDecision(35);
  else if(age===40) screenConclusion();
}

/* ---------------- CONCLUSÃO ---------------- */
function cargoTier(){
  const s=S.stats;
  if(s.promotionChance>60) return 'lider';
  if(s.specialization>45) return 'especialista';
  if(s.experience+s.qualification>75) return 'senior';
  if(s.experience>25||s.qualification>55) return 'pleno';
  return 'junior';
}
const TIER_FLOORS={junior:25,pleno:40,senior:60,especialista:75,lider:75};
function cargoLevel(){
  const tier=cargoTier(); const ti=(S.pathKey==='faculdade'&&S.subArea==='ti-formal');
  const map={lider:ti?'Líder Técnico / Especialista':'Gestor(a) / Liderança',
    especialista:ti?'Desenvolvedor(a) Especialista':'Especialista Sênior',
    senior:ti?'Desenvolvedor(a) Sênior':'Sênior',
    pleno:ti?'Desenvolvedor(a) Pleno':'Pleno',
    junior:ti?'Desenvolvedor(a) Júnior / Estagiário de TI':'Júnior'};
  return map[tier];
}
function salaryTier(){
  const v=S.stats.salary;
  if(v>75) return 'alto';
  if(v>50) return 'médio-alto';
  if(v>30) return 'médio';
  return 'inicial';
}
function aiImpact(){
  const s=S.stats;
  if(s.automationRisk>60 && s.techAdapt<35) return {cls:'warn',emoji:'🔴',title:'Grande necessidade de adaptação',
    txt:'Sua profissão sofreu forte pressão da automação e você não acompanhou as mudanças tecnológicas na mesma velocidade. Suas oportunidades diminuíram, mas sua experiência ainda tem valor caso você se atualize agora.'};
  if(s.automationRisk>55) return {cls:'warn',emoji:'🟠',title:'Automação parcial',
    txt:'Parte significativa das suas tarefas repetitivas foi automatizada. Você ainda trabalha na área, mas o volume de vagas tradicionais diminuiu.'};
  if(s.techAdapt>65 && s.aiExposure>50) return {cls:'blue',emoji:'🔵',title:'Transformação com oportunidade',
    txt:'Sua decisão de aprender a trabalhar com novas tecnologias abriu oportunidades em uma área emergente. A IA se tornou uma ferramenta do seu dia a dia, não uma ameaça.'};
  if(s.humanRelated||P[S.profId].humanSkill>65) return {cls:'gold',emoji:'🟡',title:'Baixo impacto direto',
    txt:'Sua profissão depende fortemente de relação humana, julgamento e confiança — habilidades que a automação ainda reproduz com dificuldade. O impacto da IA foi mais indireto do que direto.'};
  return {cls:'',emoji:'🟢',title:'Transformação significativa',
    txt:'Sua carreira permaneceu relevante, mas mudou significativamente. Tarefas repetitivas foram automatizadas e novas habilidades passaram a ser exigidas.'};
}
function possibleFutures(){
  const s=S.stats; const pr=P[S.profId];
  const adapt = s.techAdapt>55
    ? 'Continuar investindo em novas ferramentas e em IA deve ampliar ainda mais suas oportunidades, consolidando sua posição como alguém que trabalha COM a tecnologia.'
    : 'Se você passar a investir em requalificação tecnológica a partir de agora, pode reduzir o risco de automação e abrir novas frentes de atuação.';
  const manter = s.automationRisk>55
    ? 'Manter a rotina exatamente como está tende a reduzir ainda mais a quantidade de vagas tradicionais disponíveis na sua função ao longo da próxima década.'
    : 'Manter o ritmo atual deve preservar uma trajetória estável, com mudanças gerenciáveis conforme o mercado evoluir.';
  const mudar = s.careerChangeChance>45 || s.humanSkill>65
    ? `Uma migração de carreira, aproveitando suas habilidades humanas (relação, julgamento, confiança), tende a abrir espaço em funções menos automatizáveis dentro ou fora de ${pr.area.toLowerCase()}.`
    : 'Uma mudança de carreira agora seria mais arriscada, mas ainda viável caso venha acompanhada de nova qualificação.';
  return [['SE CONTINUAR SE ADAPTANDO',adapt],['SE MANTER A ROTINA ATUAL',manter],['SE MUDAR DE DIREÇÃO',mudar]];
}

function screenConclusion(){
  clearSnapshot(); sfx('complete');
  CURRENT_SCREEN=screenConclusion;
  const pr=P[S.profId];
  if(pr.id==='arquiteto'){
    const n=el(`${bar(100)}<div class="eyebrow">SUA JORNADA · ARQUITETURA</div>
      <div class="big" style="font-size:25px">📐 Resultado da sua jornada: Arquitetura</div>
      <div class="result warn"><h3>🏗️ Diploma não encontrado</h3>
      <p>Você sobreviveu às pranchetas, às maquetes que desabaram no ônibus, aos professores pedindo "mais um pouco de conceito" às 3 da manhã, e até aprendeu a fingir que o AutoCAD nunca travou.</p>
      <p>Mas, por um motivo que nem a IA, nem a ciência e nem a coordenação do curso souberam explicar, aquela única disciplina pendente nunca apareceu lançada no sistema.</p>
      <p><b>Status:</b> diploma não encontrado.<br><b>Nível de café no sangue:</b> crítico.<br><b>Risco de automação:</b> irrelevante — você ainda nem se formou.</p>
      <p>Talvez na próxima versão desta simulação você finalmente entregue o TFG a tempo. 🏗️</p></div>
      <div class="btnrow"><button class="primary" id="go" type="button">Ver linha do tempo</button></div>`);
    const goArq=()=>{pushHistory();screenTimeline();};
    setNav(HISTORY.length?goBack:null, goArq);
    render(n);
    n.querySelector('#go').onclick=goArq;
    return;
  }
  const floor=TIER_FLOORS[cargoTier()];
  S.stats.finStability=Math.max(S.stats.finStability,floor);
  S.stats.fulfillment=Math.max(S.stats.fulfillment,floor);
  const impact=aiImpact();
  const futures=possibleFutures();
  const n=el(`${bar(100)}<div class="eyebrow">SUA JORNADA</div>
    <div class="big" style="font-size:26px">Conclusão personalizada</div>
    <div class="summary-row"><span>Profissão final</span><span>${pr.name}</span></div>
    <div class="summary-row"><span>Área</span><span>${pr.area}</span></div>
    <div class="summary-row"><span>Cargo</span><span>${cargoLevel()}</span></div>
    <div class="summary-row"><span>Nível salarial</span><span>${salaryTier()}</span></div>
    <div class="summary-row"><span>Situação profissional</span><span>${S.employed?'Empregado(a)':'Desempregado(a)'}</span></div>
    ${statBadges(['finStability','physFatigue','mentalStress','fulfillment'])}
    ${statBadges(['automationRisk','aiExposure','techAdapt','opportunities'])}
    <div class="result ${impact.cls}"><h3>${impact.emoji} Impacto da IA: ${impact.title}</h3><p>${impact.txt}</p></div>
    <div class="lead" style="margin-top:18px">FUTUROS POSSÍVEIS A PARTIR DAQUI</div>
    <div class="future-grid">${futures.map(([t,p])=>`<div class="future-card"><div class="ft">${t}</div><p>${p}</p></div>`).join('')}</div>
    <div class="btnrow"><button class="primary" id="go" type="button">Ver linha do tempo</button></div>`);
  const goTl=()=>{pushHistory();sfx('advance');screenTimeline();};
  setNav(HISTORY.length?goBack:null, goTl);
  render(n);
  n.querySelector('#go').onclick=goTl;
}

function screenTimeline(){
  CURRENT_SCREEN=screenTimeline;
  const n=el(`<div class="eyebrow">LINHA DO TEMPO</div>
    <div class="lead">${S.timeline.length} decisões moldaram essa versão da sua carreira.</div>
    <div class="vtimeline">${S.timeline.map(t=>`<div class="ev"><div class="age">${t.age} anos</div><div class="txt">${t.text}</div></div>`).join('')}</div>
    <div class="line" style="color:var(--dim);font-size:13.5px">Essa foi apenas uma entre muitas jornadas possíveis. Outras escolhas, em outros momentos, teriam levado a um futuro diferente.</div>
    <div class="btnrow"><button class="primary" id="restart" type="button">RECOMEÇAR MINHA HISTÓRIA</button></div>`);
  setNav(HISTORY.length?goBack:null, null);
  render(n);
  n.querySelector('#restart').onclick=screenIntro;
}

const RESUME_MAP={18:()=>{S.pathKey==='faculdade'?screenFacultyArea():screenFirstJob();},21:()=>screenDecision(25),22:()=>screenDecision(25),23:()=>screenDecision(25),24:()=>screenDecision(25),25:()=>screenDecision(28),28:()=>screenDecision(31),31:()=>screenDecision(35),35:()=>screenDecision(40),40:()=>screenConclusion()};
gearBtn();
(function boot(){
  try{
    const saved=loadSnapshot();
    if(saved&&saved.S&&RESUME_MAP[saved.lastAge]){
      const n=el(`<div class="eyebrow">BEM-VINDO DE VOLTA</div><div class="big" style="font-size:24px">Você tem uma jornada salva (${saved.lastAge} anos).</div>
        <div class="btnrow"><button class="primary" id="cont" type="button">Continuar jornada</button><button class="ghost" id="fresh" type="button">Começar nova</button></div>`);
      render(n);
      n.querySelector('#cont').onclick=()=>{
        try{ S=saved.S; RESUME_MAP[saved.lastAge](); }
        catch(e){ clearSnapshot(); screenIntro(); }
      };
      n.querySelector('#fresh').onclick=()=>{clearSnapshot();screenIntro();};
    }else{screenIntro();}
  }catch(e){
    try{ clearSnapshot(); screenIntro(); }
    catch(e2){ app.innerHTML='<div style="padding:40px;text-align:center;color:#fff;font-family:system-ui">Ocorreu um erro ao carregar. Recarregue a página.</div>'; }
  }
})();
</script>
